# Throwaway Postgres + Redis for `npm run test:integration` on the laptop. NOT the app, NOT production.
#   Start:  docker compose -f docker-compose.test.yml up -d --wait
#   Stop:   docker compose -f docker-compose.test.yml down
# Own project name and high ports, so it never touches your real local database (port 5432) or Redis (6379).
# Data lives in memory (tmpfs): `down` throws it away. The password below is a test value, not a secret.
name: livescore-test

services:
  test-db:
    image: postgres:16
    environment:
      POSTGRES_USER: livescore
      POSTGRES_PASSWORD: test
      POSTGRES_DB: livescore_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U livescore -d livescore_test"]
      interval: 2s
      timeout: 5s
      retries: 30

  test-redis:
    image: redis:7
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 2s
      timeout: 5s
      retries: 30
