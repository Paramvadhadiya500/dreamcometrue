# Runs the tests on GitHub for every push and every pull request.
# Result: a green check (or red cross) next to each commit on GitHub, and on the "Actions" tab.
# Rule: deploy to the server only a commit with a green check.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read            # read the code, nothing else

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22.23"   # keep the same as the Dockerfile (FROM node:22.23-alpine)
          cache: npm

      - name: Install exactly the locked packages
        run: npm ci

      - name: Unit tests
        run: node test.js

      - name: Shell scripts have no syntax errors
        run: for f in scripts/*.sh; do bash -n "$f" || exit 1; done

  # The production image builds, and the app inside it does NOT run as root (Dockerfile: USER node).
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Build the production image
        run: docker build -t livescore-ci .

      - name: App in the image runs as a normal user, not root
        run: scripts/check-image-user.sh livescore-ci

  # The real server.js against a throwaway Postgres and Redis (test-integration.js).
  # Same images as docker-compose.yml. The password is a test value for this run only, not a secret.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: livescore
          POSTGRES_PASSWORD: test
          POSTGRES_DB: livescore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U livescore -d livescore_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://livescore:test@localhost:5432/livescore_test
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22.23"   # keep the same as the Dockerfile (FROM node:22.23-alpine)
          cache: npm

      - name: Install exactly the locked packages
        run: npm ci

      - name: Integration test (scoring write path)
        run: node test-integration.js
