services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3000
      DATABASE_URL: postgres://livescore:${DB_PASSWORD}@db:5432/livescore
      REDIS_URL: redis://redis:6379
      TRUST_PROXY: 1          # Caddy sits in front: use the visitor address it passes on
    depends_on:
      - db
      - redis

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: livescore
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: livescore
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: "${DOMAIN:-:80}"                    # empty means plain HTTP on port 80
      ACME_PROFILE: "${ACME_PROFILE:-classic}"    # use "shortlived" when DOMAIN is an IP address
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
