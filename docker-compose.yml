# Log size limit, used by every service below ("*logging"). Docker keeps each container's output in a file that
# otherwise grows without end (the server disk is 20 GiB; a full disk stops Postgres from saving anything).
# Each container: at most 3 files of 10 MB (about 30 MB); the oldest is deleted. Applies when a container is
# created again (`docker compose up -d` does that for every service whose settings changed).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build: .
    restart: unless-stopped
    logging: *logging
    env_file: .env
    environment:
      PORT: 3000
      DATABASE_URL: postgres://livescore:${DB_PASSWORD}@db:5432/livescore
      REDIS_URL: redis://redis:6379
      TRUST_PROXY: 1          # Caddy sits in front: use the visitor address it passes on
    depends_on:               # start the app only when the database and Redis really answer
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: livescore
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: livescore
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1: during its very first start Postgres runs a temporary server that only listens on a
      # local socket; asking over TCP means "healthy" only once the real server is up
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U livescore -d livescore"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  caddy:
    image: caddy:2
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: "${DOMAIN:-:80}"                    # empty means plain HTTP on port 80
      ACME_PROFILE: "${ACME_PROFILE:-classic}"    # use "shortlived" when DOMAIN is an IP address
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./public-errors:/srv/errors:ro            # the "back in a moment" page (Caddyfile, handle_errors)
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
