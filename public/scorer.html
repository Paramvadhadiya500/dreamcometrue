<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: sans-serif; margin: 0; }
  #conn { padding: 10px; color: white; text-align: center; font-weight: bold; }
  .ok { background: #2a7; }
  .bad { background: #c33; }
  .box { padding: 8px 12px; }
  button { font-size: 26px; padding: 20px; margin: 6px; }
  .big { width: 45%; }
  .grid button { width: 28%; font-size: 24px; padding: 18px 4px; margin: 4px 1%; }
  #undo { width: 92%; background: #fdd; }
  #finish { width: 92%; background: #def; }
  input { font-size: 20px; padding: 10px; width: 90%; }
  .err { color: #c33; }
  .over { font-size: 22px; letter-spacing: 2px; word-spacing: 6px; min-height: 28px; }
  .free { background: #fc0; padding: 6px 10px; font-weight: bold; text-align: center; margin: 4px 0; }
  .modes button, .runs button, .picks button { margin: 3px 0.7%; }
  .modes button { width: 22%; font-size: 16px; padding: 12px 2px; }
  .modes button.on { background: #fc6; border: 3px solid #c80; }
  .runs button { width: 22%; font-size: 28px; padding: 16px 0; }
  .picks button { width: 30%; font-size: 17px; padding: 12px 2px; }
  #wktBtn { width: 92%; background: #f99; font-size: 24px; padding: 14px; }
  .small { font-size: 15px; padding: 10px; }
  .hint { color: #630; min-height: 22px; padding: 0 12px; }
  button.names { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vs { font-size: 18px; font-weight: bold; }
  /* sending status and warnings */
  #pending { padding: 6px 8px; border-radius: 4px; }
  #pending.slow { background: #fd8; }
  #pending.alarm, .alarm { background: #c33; color: white; font-weight: bold; }
  .alarm, .note { padding: 8px 10px; margin: 6px 0; border-radius: 4px; }
  .note { background: #def; }
  .alarm button, .note button { font-size: 16px; padding: 10px 14px; margin: 6px 6px 0 0; }
</style>

<div id="loginBox" style="display:none; padding:16px">
  <h2>Scorer login</h2>
  <input id="u" placeholder="username" autocapitalize="none"><br><br>
  <input id="p" type="password" placeholder="password"><br><br>
  <button onclick="login()" style="width:auto; font-size:20px; padding:12px 24px">Log in</button>
  <p id="loginErr" class="err"></p>
</div>

<div id="app" style="display:none">
  <div id="conn" class="bad">Connecting...</div>
  <div class="box">
    <small id="who"></small>
    <button onclick="logoutClicked()" style="width:auto; font-size:14px; padding:4px 10px">Log out</button><br>
    <select id="match"></select>

    <h2 id="name"></h2>

    <div id="ttView" style="display:none">
      <div class="vs" id="ttNames"></div>
      <h1><span id="gA">0</span> : <span id="gB">0</span> <small id="ttUnit">games</small></h1>
      <div id="vbInfo" style="display:none"></div>
      <h2><span id="pA">0</span> - <span id="pB">0</span></h2>
    </div>
    <div id="simpleView" style="display:none">
      <div class="vs" id="simpleNames"></div>
      <h1><span id="sA">0</span> : <span id="sB">0</span></h1>
    </div>
    <div id="crView" style="display:none">
      <h1 id="crBig" style="margin:6px 0"></h1>
      <div id="crOvers"></div>
      <div id="crChase"></div>
      <div id="crFirst"></div>
      <div id="crFree" class="free" style="display:none">FREE HIT: only a run out is possible</div>
      <div id="crOver" class="over"></div>
    </div>

    <p id="status"></p>
    <p id="pending"></p>
    <div id="storageWarn" class="alarm" style="display:none">This phone cannot save entries (private mode or storage blocked). Do NOT reload or close this page until all entries are sent.</div>
    <div id="rejBox" class="alarm" style="display:none">
      <div id="rejText"></div>
      <button onclick="ackRejected()">OK, I saw it</button>
    </div>
    <div id="stuckBox" class="alarm" style="display:none">
      <div id="stuckText"></div>
      <button onclick="skipStuck()">Skip this entry</button>
    </div>
    <div id="othersBox" class="note" style="display:none">
      <div id="othersText"></div>
      <button onclick="adoptOthers()">Send them as me</button>
      <button onclick="discardOthers()">Discard</button>
    </div>
    <p id="err" class="err"></p>
  </div>

  <div id="ttControls" style="display:none">
    <button class="big names" id="ttA" onclick="act('point','A',1)">+1 Team A</button>
    <button class="big names" id="ttB" onclick="act('point','B',1)">+1 Team B</button>
    <div id="vbFinish" style="display:none">
      <button class="small names" id="vbFinA" onclick="finishVolleyball('A')">Finish: Team A wins</button>
      <button class="small names" id="vbFinB" onclick="finishVolleyball('B')">Finish: Team B wins</button>
    </div>
  </div>

  <div id="simpleControls" class="grid" style="display:none">
    <div>
      <button id="sA1" class="names" onclick="act('point','A',1)">A +1</button><button id="sA2" class="names" onclick="act('point','A',2)">A +2</button><button id="sA3" class="names" onclick="act('point','A',3)">A +3</button>
    </div>
    <div>
      <button id="sB1" class="names" onclick="act('point','B',1)">B +1</button><button id="sB2" class="names" onclick="act('point','B',2)">B +2</button><button id="sB3" class="names" onclick="act('point','B',3)">B +3</button>
    </div>
    <button id="finish" onclick="finishMatch()">FINISH MATCH</button>
  </div>

  <div id="crControls" style="display:none">
    <div class="modes">
      <button id="m-wide" onclick="setMode('wide')">Wide</button><button id="m-noball" onclick="setMode('noball')">No ball</button><button id="m-bye" onclick="setMode('bye')">Bye</button><button id="m-legbye" onclick="setMode('legbye')">Leg bye</button>
    </div>
    <div id="crHint" class="hint"></div>
    <div class="runs" id="runBtns">
      <button id="r0" onclick="recordBall(0)">0</button><button id="r1" onclick="recordBall(1)">1</button><button id="r2" onclick="recordBall(2)">2</button><button id="r3" onclick="recordBall(3)">3</button><button id="r4" onclick="recordBall(4)">4</button><button id="r5" onclick="recordBall(5)">5</button><button id="r6" onclick="recordBall(6)">6</button>
    </div>
    <button id="wktBtn" onclick="openWicket()">WICKET</button>
    <div id="wktPick" class="picks" style="display:none"></div>
    <div id="runoutPick" class="picks" style="display:none"></div>
    <div id="crLast" class="hint"></div>
    <div>
      <button class="small" onclick="endInnings()">End innings</button>
      <button class="small" onclick="abandonMatch()">Abandon match</button>
    </div>
  </div>

  <div id="undoRow" style="display:none">
    <button id="undo" onclick="act('undo')">UNDO last action</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/queue.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const sel = $("match");

  // phone storage; some browsers block it (private mode). Then the queue works in memory and the page says so.
  const store = (() => {
    try { const s = window.localStorage; s.getItem("probe"); return s; }
    catch (e) { return { getItem() { throw e; }, setItem() { throw e; }, removeItem() {} }; }
  })();
  const SKEY = "scorer-session";
  const q = ScorerQueue.createQueue({ storage: store });     // public/queue.js (tested in test.js)
  let session = null;
  try { session = JSON.parse(store.getItem(SKEY) || "null"); } catch (e) { session = null; }
  function saveSession() { try { store.setItem(SKEY, JSON.stringify(session)); } catch (e) { /* works until reload */ } }
  let socket = null;
  let sending = false;
  let retryTimer = null;    // next try after a failed send
  let nextTryAt = 0;
  let tickTimer = null;     // refreshes "oldest: 45 s" once a second
  const latest = {};

  // ---------- login / logout ----------
  async function login() {
    $("loginErr").textContent = "";
    try {
      const r = await fetch("/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: $("u").value.trim(), password: $("p").value }),
      });
      const data = await r.json();
      if (!r.ok) { $("loginErr").textContent = data.error || "login failed"; return; }
      session = data;
      saveSession();
      $("p").value = "";
      start();
    } catch (e) {
      $("loginErr").textContent = "Cannot reach the server";
    }
  }

  // asks the server which matches this scorer has now, so a new assignment shows up without logging in again
  let refreshTimer = null;
  async function refreshMatches() {
    if (!session) return;
    try {
      const r = await fetch("/api/my-matches", { headers: { Authorization: "Bearer " + session.token } });
      if (r.status === 401) { logout(); $("loginErr").textContent = "Session expired. Please log in again."; return; }
      if (!r.ok) return;
      const list = await r.json();
      const keep = sel.value;
      const same = list.length === sel.options.length && list.every((m, i) => sel.options[i].value === m.id && sel.options[i].textContent === m.name);
      if (same) return;
      session.matches = list;
      saveSession();
      sel.innerHTML = "";
      for (const m of list) {
        const o = document.createElement("option");
        o.value = m.id;
        o.textContent = m.name;
        sel.appendChild(o);
      }
      if (list.some((m) => m.id === keep)) { sel.value = keep; return; }
      if (sel.onchange) sel.onchange();                  // the selected match is gone: show the first one
      if (list.length === 0) $("name").textContent = "No matches assigned to you yet";
    } catch (e) { /* offline: keep the list we have */ }
  }

  // the Log out button: warn first if entries are still waiting (they stay on the phone)
  function logoutClicked() {
    const s = session ? q.status(session.username) : null;
    if (s && s.waiting > 0 && !confirm("You have " + s.waiting + " unsent entries. They stay on this phone, but nothing is sent until you log in again. Log out anyway?")) return;
    logout();
  }

  // also used when the login has expired (no question then)
  function logout() {
    if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
    if (tickTimer) { clearInterval(tickTimer); tickTimer = null; }
    if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
    try { store.removeItem(SKEY); } catch (e) { /* ignore */ }
    session = null;
    if (socket) { socket.disconnect(); socket = null; }
    $("app").style.display = "none";
    $("loginBox").style.display = "block";
  }

  // ---------- queue (logic in public/queue.js) ----------
  function newId() { return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10); }

  function act(type, team, value, data) {
    if (!sel.value || !session) return;
    const r = q.add({ id: newId(), matchId: sel.value, type, team, value, data }, session.username);
    $("err").textContent = r.ok ? "" : "Not sent: 500 entries are already waiting. Wait for the network.";
    render();
    if (r.ok) flush();
  }

  function finishMatch() {
    if (confirm("Finish this match? You can still press UNDO afterwards.")) act("finish");
  }

  // volleyball: end the match early (walkover or time limit). The scorer must pick the winner.
  function finishVolleyball(team) {
    const name = lastState ? teamName(lastState, team) : "Team " + team;
    if (confirm("Finish the match and give the win to " + name + "? You can still press UNDO afterwards.")) {
      act("finish", null, null, { winner: team });
    }
  }

  // sends the first waiting entry. force = called by the retry timer or a fresh connection;
  // a normal tap does not jump the waiting time after a failure.
  function flush(force) {
    if (sending || !session || !socket || !socket.connected) return;
    if (retryTimer && !force) return;
    if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
    const item = q.head(session.username);
    if (!item) return;
    sending = true;

    socket.timeout(5000).emit("score:action", q.payload(item), (err, res) => {
      sending = false;
      const r = q.result(item, err ? null : res);      // same entry, same id, until the server clearly answers
      if (r.action === "retry") {
        nextTryAt = Date.now() + r.delay;
        retryTimer = setTimeout(() => { retryTimer = null; flush(true); }, r.delay);
      } else {
        nextTryAt = 0;
        flush();
      }
      render();
    });
  }

  // ---------- the boxes: rejected, stuck, other scorer's entries ----------
  function entryText(x) {
    const m = ((session && session.matches) || []).find((mm) => mm.id === x.matchId);
    let t;
    try {
      if (x.type === "ball" && x.data) t = describe(x.data);
      else if (x.type === "point") t = "+" + (x.value || 1) + " for team " + x.team;
      else if (x.type === "undo") t = "UNDO";
      else if (x.type === "finish") t = "Finish match" + (x.data && x.data.winner ? " (team " + x.data.winner + " wins)" : "");
      else if (x.type === "end_innings") t = "End innings";
      else t = String(x.type);
    } catch (e) { t = String(x.type); }
    return (m ? m.name + ": " : "") + t;
  }

  function ackRejected() { q.ackRejected(); render(); }

  function skipStuck() {
    const h = session && q.head(session.username);
    if (!h) return;
    if (!confirm("Skip this entry: " + entryText(h) + "?\nIt will NOT be counted. It stays in the 'not counted' list so you can enter it again.")) return;
    q.skipHead(session.username);
    render();
    flush(true);
  }

  function adoptOthers() { q.adoptOthers(session.username); render(); flush(true); }

  function discardOthers() {
    const n = Object.values(q.status(session.username).others).reduce((a, b) => a + b, 0);
    if (!confirm("Discard " + n + " entries of the other scorer? They will NOT be counted (they stay in the 'not counted' list).")) return;
    q.discardOthers(session.username);
    render();
  }

  // ---------- cricket scoring ----------
  let mode = null;          // null | "wide" | "noball" | "bye" | "legbye"
  let lastState = null;     // newest state of the selected match
  let busyUntil = 0;        // ignores accidental double taps

  const MODE_NAMES = { wide: "Wide", noball: "No ball", bye: "Bye", legbye: "Leg bye" };
  const KIND_NAMES = { bowled: "Bowled", caught: "Caught", lbw: "LBW", stumped: "Stumped", runout: "Run out", hitwicket: "Hit wicket" };
  const HINTS = {
    wide: "WIDE: tap the EXTRA runs (0 if none, 4 if it went to the boundary)",
    noball: "NO BALL: tap the runs hit off the bat (0 if none)",
    bye: "BYE: tap the runs run (at least 1)",
    legbye: "LEG BYE: tap the runs run (at least 1)",
  };

  function setMode(m) {
    mode = mode === m ? null : m;
    closePickers();
    updateCricketUI();
  }

  function closePickers() {
    $("wktPick").style.display = "none";
    $("runoutPick").style.display = "none";
  }

  function updateCricketUI() {
    for (const m of Object.keys(MODE_NAMES)) $("m-" + m).className = mode === m ? "on" : "";
    $("crHint").textContent = mode ? HINTS[mode] : "";
    $("r0").disabled = mode === "bye" || mode === "legbye";      // a bye needs at least 1 run
  }

  function describe(data) {
    let t;
    if (data.extra === "wide") t = "Wide" + (data.runs ? " + " + data.runs : "");
    else if (data.extra === "noball") t = "No ball" + (data.runs ? " + " + data.runs + " off the bat" : "");
    else if (data.extra === "bye") t = data.runs + " bye" + (data.runs > 1 ? "s" : "");
    else if (data.extra === "legbye") t = data.runs + " leg bye" + (data.runs > 1 ? "s" : "");
    else t = data.runs === 0 ? "Dot ball" : data.runs + (data.runs === 1 ? " run" : " runs");
    if (data.wicket) t += " + WICKET (" + KIND_NAMES[data.wicket.kind] + ")";
    return t;
  }

  function recordBall(runs, wicketKind) {
    const now = Date.now();
    if (now < busyUntil) return;
    busyUntil = now + 600;
    const data = { runs, extra: mode };
    if (wicketKind) data.wicket = { kind: wicketKind };
    act("ball", undefined, undefined, data);
    $("crLast").textContent = "Sent: " + describe(data);
    mode = null;
    closePickers();
    updateCricketUI();
  }

  function allowedKinds() {
    if (lastState && lastState.freeHit) return ["runout"];
    if (mode === "wide") return ["stumped", "runout", "hitwicket"];
    if (mode) return ["runout"];
    return ["bowled", "caught", "lbw", "stumped", "runout", "hitwicket"];
  }

  function openWicket() {
    $("runoutPick").style.display = "none";
    const box = $("wktPick");
    if (box.style.display === "block") { box.style.display = "none"; return; }
    box.innerHTML = "";
    for (const kind of allowedKinds()) {
      const b = document.createElement("button");
      b.textContent = KIND_NAMES[kind];
      b.onclick = () => pickKind(kind);
      box.appendChild(b);
    }
    box.style.display = "block";
  }

  function pickKind(kind) {
    if (kind !== "runout") { recordBall(0, kind); return; }
    $("wktPick").style.display = "none";
    const box = $("runoutPick");
    box.innerHTML = "<div>Run out. How many runs were completed?</div>";
    const from = mode === "bye" || mode === "legbye" ? 1 : 0;
    for (let r = from; r <= 3; r++) {
      const b = document.createElement("button");
      b.textContent = r + (r === 1 ? " run" : " runs");
      b.onclick = () => recordBall(r, "runout");
      box.appendChild(b);
    }
    box.style.display = "block";
  }

  function endInnings() {
    if (confirm("End this innings now?")) act("end_innings");
  }

  function abandonMatch() {
    if (confirm("Abandon the match (no result)? You can still press UNDO afterwards.")) act("finish");
  }

  function showCricket(s) {
    const ci = s.innings[s.inning - 1];
    const first = s.innings[0];
    $("crBig").textContent = teamName(s, ci.battingTeam) + " " + ci.runs + "/" + ci.wickets;
    $("crOvers").textContent = ci.overs + " / " + s.maxOvers + " overs   Run rate " + ci.runRate.toFixed(2);

    let chase = "";
    if (s.inning === 2 && s.status !== "finished") {
      chase = "Target " + s.target + ". Need " + s.need + " from " + s.ballsLeft + " balls";
      if (s.requiredRate !== null) chase += " (required rate " + s.requiredRate.toFixed(2) + ")";
    }
    $("crChase").textContent = chase;
    $("crFirst").textContent = s.inning === 2
      ? teamName(s, first.battingTeam) + " batted: " + first.runs + "/" + first.wickets + " (" + first.overs + " overs)"
      : "";
    $("crOver").textContent = ci.recent.join("  ");
    $("crFree").style.display = s.freeHit ? "block" : "none";
    updateCricketUI();
  }

  // ---------- connection + display ----------
  function render() {
    if (!session) return;
    const online = socket && socket.connected;
    const s = q.status(session.username);
    $("conn").className = online ? "ok" : "bad";
    $("conn").textContent = online ? "Connected" : "OFFLINE - entries are saved on this phone";

    // how many entries wait, and for how long
    const p = $("pending");
    const sec = Math.floor(s.oldestMs / 1000);
    let text = "All entries sent", cls = "";
    if (s.waiting > 0) {
      const n = s.waiting + (s.waiting === 1 ? " entry" : " entries");
      if (s.oldestMs >= 120000) {
        text = n + " NOT sent for " + Math.floor(sec / 60) + " min. Check your signal. Do not close this page.";
        cls = "alarm";
      } else if (s.oldestMs >= 30000) {
        const wait = nextTryAt ? Math.max(1, Math.ceil((nextTryAt - Date.now()) / 1000)) : 0;
        text = n + " waiting. Oldest: " + sec + " s." + (online && wait ? " Server is slow, trying again in " + wait + " s." : "");
        cls = "slow";
      } else {
        text = n + " waiting to be sent";
      }
      if (s.warn) { text = "50+ entries waiting. Please check the network. " + text; cls = "alarm"; }
    }
    p.textContent = text;
    p.className = cls;

    $("storageWarn").style.display = s.storageOk ? "none" : "block";

    // entries that were NOT counted: stay on screen until the scorer confirms
    const rej = q.rejected();
    $("rejBox").style.display = rej.length ? "block" : "none";
    const box = $("rejText");
    box.textContent = rej.length === 1
      ? "1 entry was REJECTED by the server. It was NOT counted:"
      : rej.length + " entries were NOT counted:";
    for (const x of rej) {
      const line = document.createElement("div");
      line.textContent = "- " + entryText(x) + " (" + x.error + ")";
      box.appendChild(line);
    }

    // the first entry keeps failing on the server
    const h = q.head(session.username);
    $("stuckBox").style.display = s.stuck && h ? "block" : "none";
    if (s.stuck && h) $("stuckText").textContent = "One entry cannot be sent: " + entryText(h) + ". Tell the admin.";

    // entries of another scorer on this phone
    const others = Object.entries(s.others);
    $("othersBox").style.display = others.length ? "block" : "none";
    if (others.length) {
      $("othersText").textContent = others.map(([u, c]) => "There are " + c + " unsent entries from " + u + " on this phone.").join(" ")
        + " They will be sent when that scorer logs in again.";
    }
  }

  function join() { if (socket && sel.value) socket.emit("join-match", sel.value); }

  const teamName = (s, t) => (t === "A" ? s.teamA : s.teamB) || "Team " + t;
  const shortName = (name) => (name.length > 14 ? name.slice(0, 13) + "\u2026" : name);

  function statusText(s) {
    if (s.status !== "finished") return "LIVE";
    if (s.resultText) return "FINISHED. " + s.resultText;
    return "FINISHED. " + (s.winner === "draw" ? "Draw" : teamName(s, s.winner) + " won");
  }

  function showState(s) {
    lastState = s;
    $("name").textContent = s.name;
    const isTT = s.sport === "table_tennis";
    const isVB = s.sport === "volleyball";
    const isCR = s.sport === "cricket";
    const isSimple = !isTT && !isCR && !isVB;
    $("ttView").style.display = isTT || isVB ? "block" : "none";
    $("simpleView").style.display = isSimple ? "block" : "none";
    $("crView").style.display = isCR ? "block" : "none";
    $("ttControls").style.display = isTT || isVB ? "block" : "none";
    $("simpleControls").style.display = isSimple ? "block" : "none";
    $("crControls").style.display = isCR && s.status !== "finished" ? "block" : "none";
    $("undoRow").style.display = "block";

    const nameA = teamName(s, "A");
    const nameB = teamName(s, "B");
    if (isTT || isVB) {
      $("ttNames").textContent = nameA + " vs " + nameB;
      $("ttA").textContent = "+1 " + shortName(nameA);
      $("ttB").textContent = "+1 " + shortName(nameB);
      $("ttUnit").textContent = isVB ? "sets" : "games";
      $("gA").textContent = isVB ? s.setsA : s.gamesA;
      $("gB").textContent = isVB ? s.setsB : s.gamesB;
      $("pA").textContent = s.pointsA;
      $("pB").textContent = s.pointsB;
      $("vbInfo").style.display = isVB && s.status !== "finished" ? "block" : "none";
      $("vbFinish").style.display = isVB && s.status !== "finished" ? "block" : "none";
      if (isVB) {
        $("vbInfo").textContent = (s.isDeciding ? "Deciding set" : "Set " + s.currentSet) + ", to " + s.target + " (win by " + s.winBy + ")";
        $("vbFinA").textContent = "Finish: " + shortName(nameA) + " wins";
        $("vbFinB").textContent = "Finish: " + shortName(nameB) + " wins";
      }
    } else if (isCR) {
      showCricket(s);
    } else {
      $("simpleNames").textContent = nameA + " vs " + nameB;
      for (const n of [1, 2, 3]) {
        $("sA" + n).textContent = shortName(nameA) + " +" + n;
        $("sB" + n).textContent = shortName(nameB) + " +" + n;
      }
      $("sA").textContent = s.scoreA;
      $("sB").textContent = s.scoreB;
    }
    $("status").textContent = statusText(s);
  }

  function hideAllViews() {
    for (const id of ["ttView", "simpleView", "crView", "ttControls", "simpleControls", "crControls", "undoRow"]) {
      $(id).style.display = "none";
    }
  }

  function start() {
    $("loginBox").style.display = "none";
    $("app").style.display = "block";
    $("who").textContent = session.username + " (" + session.role + ")";

    sel.innerHTML = "";
    for (const m of session.matches) {
      const o = document.createElement("option");
      o.value = m.id;
      o.textContent = m.name;
      sel.appendChild(o);
    }

    if (socket) socket.disconnect();
    socket = io({ auth: { token: session.token } });

    socket.on("connect", () => { join(); nextTryAt = 0; render(); flush(true); });   // back online: send at once
    socket.on("disconnect", render);
    socket.on("connect_error", (err) => {
      if (err.message === "invalid token") {            // expired or fake token
        logout();
        $("loginErr").textContent = "Session expired. Please log in again.";
      }
      render();
    });
    socket.on("score:update", (s) => {
      if (s.matchId !== sel.value) return;
      if (s.version < (latest[s.matchId] || 0)) return;
      latest[s.matchId] = s.version;
      showState(s);
    });
    render();
    refreshMatches();
    if (refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(refreshMatches, 30000);
    if (tickTimer) clearInterval(tickTimer);
    tickTimer = setInterval(render, 1000);          // keeps "Oldest: 45 s" up to date
  }

  sel.onchange = () => {
    hideAllViews();
    mode = null;
    lastState = null;
    $("crLast").textContent = "";
    $("name").textContent = "Loading...";
    join();
  };

  if (session) start(); else $("loginBox").style.display = "block";
</script>
