<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sports Live</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f4f6f8; color: #111; }
  header { background: #1f3a5f; color: #fff; padding: 14px 16px; }
  header h1 { margin: 0; font-size: 22px; }
  .tabs { display: flex; gap: 6px; padding: 10px 12px; background: #fff; position: sticky; top: 0; border-bottom: 1px solid #ddd; z-index: 1; }
  .tabs button { flex: 1; font-size: 15px; padding: 10px 2px; border: 1px solid #ccd; background: #fff; border-radius: 6px; }
  .tabs button.on { background: #1f3a5f; color: #fff; border-color: #1f3a5f; }
  .bar { padding: 10px 12px 0; }
  select { font-size: 16px; padding: 6px; max-width: 100%; }
  main { padding: 0 12px 24px; }
  a.card { display: block; background: #fff; border-radius: 8px; padding: 10px 12px; margin: 10px 0; text-decoration: none; color: inherit; border-left: 5px solid #bbb; box-shadow: 0 1px 2px #0002; }
  a.card.live { border-left-color: #d22; }
  a.card.finished { border-left-color: #2a7; }
  .teams { font-weight: bold; font-size: 17px; margin-top: 2px; }
  .headline { margin-top: 4px; }
  .result { margin-top: 4px; font-weight: bold; color: #176; }
  .small { color: #555; font-size: 14px; }
  .liveTag { color: #d22; font-weight: bold; }
  h2.day { font-size: 16px; margin: 18px 0 0; color: #345; }
  h2.comp { font-size: 18px; margin: 18px 0 6px; }
  table { border-collapse: collapse; width: 100%; background: #fff; border-radius: 8px; overflow: hidden; }
  th, td { padding: 8px 4px; text-align: center; border-bottom: 1px solid #eee; font-size: 15px; }
  th.team, td.team { text-align: left; padding-left: 10px; }
  th { background: #e8edf3; font-size: 13px; }
  .note { color: #a40; font-size: 14px; padding: 6px 12px; min-height: 18px; }
  .empty { color: #555; padding: 12px 2px; }
</style>
</head>
<body>
<header><h1>Sports Live</h1></header>

<div class="tabs">
  <button data-tab="live" onclick="setTab('live')">Live</button>
  <button data-tab="schedule" onclick="setTab('schedule')">Schedule</button>
  <button data-tab="results" onclick="setTab('results')">Results</button>
  <button data-tab="points" onclick="setTab('points')">Points</button>
</div>

<div class="bar">
  <select id="comp" onchange="render()"><option value="">All sports</option></select>
</div>
<div class="note" id="note"></div>
<main id="list"></main>

<script>
  const $ = (id) => document.getElementById(id);
  let tab = "live";
  let home = { matches: [], competitions: [] };
  let standings = { competitions: [], points: null };
  let loaded = false;
  let failed = false;

  function el(tag, text, cls) {
    const e = document.createElement(tag);
    if (text !== undefined && text !== null) e.textContent = text;
    if (cls) e.className = cls;
    return e;
  }

  const timeFmt = { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" };
  const dayFmt = { weekday: "long", day: "numeric", month: "long" };
  const fmtTime = (iso) => (iso ? new Date(iso).toLocaleString([], timeFmt) : "");
  const fmtDay = (iso) => (iso ? new Date(iso).toLocaleDateString([], dayFmt) : "Time to be announced");

  function card(m) {
    const a = el("a", undefined, "card " + m.status);
    a.href = "/match.html?id=" + encodeURIComponent(m.id);

    const top = el("div", undefined, "small");
    top.appendChild(document.createTextNode(m.competition + (m.stage === "knockout" ? " \u00b7 Knockout" : "") + " \u00b7 "));
    if (m.status === "live") top.appendChild(el("span", "LIVE", "liveTag"));
    else top.appendChild(document.createTextNode(m.status === "finished" ? "Finished" : (fmtTime(m.startTime) || "Time to be announced")));
    a.appendChild(top);

    a.appendChild(el("div", m.hasTeams ? m.teamA + " vs " + m.teamB : m.name, "teams"));

    if (m.status === "upcoming") {
      if (m.venue) a.appendChild(el("div", m.venue, "small"));
    } else {
      if (m.headline) a.appendChild(el("div", m.headline, "headline"));
      if (m.status === "finished" && m.resultText) a.appendChild(el("div", m.resultText, "result"));
      else if (m.venue) a.appendChild(el("div", m.venue, "small"));
    }
    return a;
  }

  function visible() {
    const c = $("comp").value;
    return home.matches.filter((m) => !c || m.competition === c);
  }

  function renderTable(c, points) {
    const wrap = el("div");
    wrap.appendChild(el("h2", c.name, "comp"));
    const t = el("table");
    const head = el("tr");
    const cols = ["Team", "P", "W", "D", "L", "Pts", c.hasNrr ? "NRR" : "Diff"];
    cols.forEach((h, i) => head.appendChild(el("th", h, i === 0 ? "team" : "")));
    t.appendChild(head);
    c.rows.forEach((r) => {
      const tr = el("tr");
      tr.appendChild(el("td", r.team, "team"));
      [r.played, r.won, r.drawn, r.lost, r.points].forEach((v) => tr.appendChild(el("td", String(v))));
      const last = c.hasNrr
        ? (r.nrr === null ? "-" : (r.nrr > 0 ? "+" : "") + r.nrr.toFixed(3))
        : (r.diff > 0 ? "+" : "") + r.diff;
      tr.appendChild(el("td", last));
      t.appendChild(tr);
    });
    wrap.appendChild(t);
    return wrap;
  }

  function render() {
    const box = $("list");
    box.textContent = "";
    document.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === tab));

    if (!loaded) {
      box.appendChild(el("p", failed ? "Cannot load the scores. Trying again..." : "Loading...", "empty"));
      return;
    }

    const list = visible();

    if (tab === "live") {
      const live = list.filter((m) => m.status === "live");
      if (live.length === 0) {
        box.appendChild(el("p", "No match is live right now.", "empty"));
        const next = list.filter((m) => m.status === "upcoming").slice(0, 5);
        if (next.length) {
          box.appendChild(el("h2", "Coming up", "day"));
          next.forEach((m) => box.appendChild(card(m)));
        }
      } else {
        live.forEach((m) => box.appendChild(card(m)));
      }
    } else if (tab === "schedule") {
      if (list.length === 0) box.appendChild(el("p", "No matches yet.", "empty"));
      let lastDay = null;
      list.forEach((m) => {
        const day = fmtDay(m.startTime);
        if (day !== lastDay) { box.appendChild(el("h2", day, "day")); lastDay = day; }
        box.appendChild(card(m));
      });
    } else if (tab === "results") {
      const done = list.filter((m) => m.status === "finished").reverse();
      if (done.length === 0) box.appendChild(el("p", "No results yet.", "empty"));
      done.forEach((m) => box.appendChild(card(m)));
    } else {
      const c = $("comp").value;
      const tables = standings.competitions.filter((x) => !c || x.name === c);
      if (tables.length === 0) box.appendChild(el("p", "No finished group-stage matches yet.", "empty"));
      tables.forEach((x) => box.appendChild(renderTable(x, standings.points)));
      if (tables.length && standings.points) {
        box.appendChild(el("p", "Win " + standings.points.win + ", draw / tie / no result " + standings.points.draw +
          ", loss " + standings.points.loss + ". Only group-stage matches count. P played, W won, D drawn, L lost, " +
          "NRR net run rate, Diff score difference.", "small"));
      }
    }
  }

  function fillCompetitions() {
    const sel = $("comp");
    const keep = sel.value;
    sel.innerHTML = "";
    const all = document.createElement("option");
    all.value = "";
    all.textContent = "All sports";
    sel.appendChild(all);
    for (const name of home.competitions) {
      const o = document.createElement("option");
      o.value = name;
      o.textContent = name;
      sel.appendChild(o);
    }
    if (keep && home.competitions.includes(keep)) sel.value = keep;
  }

  async function refresh() {
    try {
      const r = await fetch("/api/home", { cache: "no-store" });
      if (!r.ok) throw new Error("bad status " + r.status);
      home = await r.json();
      if (tab === "points") {
        const s = await fetch("/api/standings", { cache: "no-store" });
        if (s.ok) standings = await s.json();
      }
      loaded = true;
      failed = false;
      $("note").textContent = "";
    } catch (e) {
      failed = true;
      $("note").textContent = loaded ? "Connection problem. Showing the last scores." : "";
    }
    fillCompetitions();
    render();
  }

  function setTab(t) {
    tab = t;
    render();
    if (t === "points") refresh();
  }

  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refresh(); });
  setInterval(() => { if (document.visibilityState !== "hidden") refresh(); }, 10000);
  render();
  refresh();
</script>
</body>
</html>
