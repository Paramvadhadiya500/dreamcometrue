<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sports Live</title>
<!-- Tab icon, written into the page (no extra download; without it browsers ask for /favicon.ico and get 404). -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f3a5f'/%3E%3Ccircle cx='15' cy='17' r='8' fill='none' stroke='%23fff' stroke-width='3'/%3E%3Ccircle cx='25' cy='7' r='4.5' fill='%23d22'/%3E%3C/svg%3E">
<!-- Color of the phone's browser bar. Same values as --brand in base.css (a meta tag cannot use CSS variables). -->
<meta name="theme-color" content="#1f3a5f" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#3a6fb3" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="/css/base.css">
<style>
  body { background: var(--bg); color: var(--text); }
  header { background: var(--brand); color: var(--on-brand); padding: 14px 16px; }
  header h1 { margin: 0; font-size: 22px; }
  .tabs { display: flex; gap: 6px; padding: 10px 12px; background: var(--surface); position: sticky; top: 0; border-bottom: 1px solid var(--border); z-index: 1; }
  .tabs button { flex: 1; font-size: 15px; padding: 10px 2px; border: 1px solid var(--control-border); background: var(--surface); border-radius: 6px; }
  .tabs button.on { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }
  .bar { padding: 10px 12px 0; }
  select { font-size: 16px; padding: 6px; max-width: 100%; }
  main { padding: 0 12px 24px; }
  a.card { display: block; background: var(--surface); border-radius: var(--radius); padding: 10px 12px; margin: 10px 0; text-decoration: none; color: inherit; border-left: 5px solid var(--upcoming); box-shadow: var(--shadow); }
  a.card.live { border-left-color: var(--live); }
  a.card.finished { border-left-color: var(--done); }
  .teams { font-weight: bold; font-size: 17px; margin-top: 2px; }
  .headline { margin-top: 4px; }
  .result { margin-top: 4px; font-weight: bold; color: var(--result); }
  .small { font-size: 14px; }
  .liveTag { color: var(--live); font-weight: bold; }
  h2.day { font-size: 16px; margin: 18px 0 0; color: var(--heading-muted); }
  h2.comp { font-size: 18px; margin: 18px 0 6px; }
  table { border-collapse: collapse; width: 100%; background: var(--surface); border-radius: var(--radius); overflow: hidden; }
  th, td { padding: 8px 4px; text-align: center; border-bottom: 1px solid var(--line); font-size: 15px; }
  th.team, td.team { text-align: left; padding-left: 10px; }
  th { background: var(--table-head); font-size: 13px; }
  .note { color: var(--note); font-size: 14px; padding: 6px 12px; min-height: 18px; }
  .empty { color: var(--text-muted); padding: 12px 2px; }

  /* A card whose content just changed (new score, now live, finished) flashes once: its background starts
     pale yellow and fades back. For "reduce motion" base.css makes this almost instant. */
  @keyframes changed { from { background-color: var(--flash); } }
  a.card.changed { animation: changed 1.5s ease-out; }

  /* Mobile first: everything above is the phone layout (1 column).
     From 640 px wide (tablet, laptop) the match cards sit in 2 columns; headings, tables and messages
     still use the full width. Grid margins do not collapse, so 10 px + 10 px = 20 px between rows: 20 px columns match. */
  @media (min-width: 640px) {
    main { display: grid; grid-template-columns: 1fr 1fr; column-gap: 20px; }
    main > :not(a.card) { grid-column: 1 / -1; }
  }
</style>
</head>
<body>
<header><h1>Sports Live</h1></header>

<div class="tabs">
  <button data-tab="live" onclick="setTab('live')">Live</button>
  <button data-tab="schedule" onclick="setTab('schedule')">Schedule</button>
  <button data-tab="results" onclick="setTab('results')">Results</button>
  <button data-tab="points" onclick="setTab('points')">Points</button>
</div>

<div class="bar">
  <label for="comp" class="sr-only">Sport</label>
  <select id="comp" onchange="render()"><option value="">All sports</option></select>
</div>
<div class="note" id="note"></div>
<main id="list"></main>

<script src="/js/home-logic.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  let tab = "live";
  let home = { matches: [], competitions: [] };
  let standings = { competitions: [], points: null };
  let standingsLoaded = false;   // true once the points table has arrived (it is only fetched on the Points tab)
  let loaded = false;
  let failed = false;

  function el(tag, text, cls) {
    const e = document.createElement(tag);
    if (text !== undefined && text !== null) e.textContent = text;
    if (cls) e.className = cls;
    return e;
  }

  const timeFmt = { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" };
  const dayFmt = { weekday: "long", day: "numeric", month: "long" };
  // One formatter each, made once (making one is the slow part); toLocaleString made a new one per card.
  const timeFormat = new Intl.DateTimeFormat([], timeFmt);
  const dayFormat = new Intl.DateTimeFormat([], dayFmt);
  const fmtTime = (iso) => (iso ? timeFormat.format(new Date(iso)) : "");
  const fmtDay = (iso) => (iso ? dayFormat.format(new Date(iso)) : "Time to be announced");

  function card(m) {
    const a = el("a", undefined, "card " + m.status);
    a.href = "/match.html?id=" + encodeURIComponent(m.id);

    const top = el("div", undefined, "small");
    top.appendChild(document.createTextNode(m.competition + (m.stage === "knockout" ? " \u00b7 Knockout" : "") + " \u00b7 "));
    if (m.status === "live") top.appendChild(el("span", "LIVE", "liveTag"));
    else top.appendChild(document.createTextNode(m.status === "finished" ? "Finished" : (fmtTime(m.startTime) || "Time to be announced")));
    a.appendChild(top);

    a.appendChild(el("div", m.hasTeams ? m.teamA + " vs " + m.teamB : m.name, "teams"));

    if (m.status === "upcoming") {
      if (m.venue) a.appendChild(el("div", m.venue, "small"));
    } else {
      if (m.headline) a.appendChild(el("div", m.headline, "headline"));
      if (m.status === "finished" && m.resultText) a.appendChild(el("div", m.resultText, "result"));
      else if (m.venue) a.appendChild(el("div", m.venue, "small"));
    }
    return a;
  }

  function visible() {
    const c = $("comp").value;
    return home.matches.filter((m) => !c || m.competition === c);
  }

  function renderTable(c, points) {
    const wrap = el("div");
    wrap.appendChild(el("h2", c.name, "comp"));
    const t = el("table");
    const head = el("tr");
    const cols = ["Team", "P", "W", "D", "L", "Pts", c.hasNrr ? "NRR" : "Diff"];
    cols.forEach((h, i) => head.appendChild(el("th", h, i === 0 ? "team" : "")));
    t.appendChild(head);
    c.rows.forEach((r) => {
      const tr = el("tr");
      tr.appendChild(el("td", r.team, "team"));
      [r.played, r.won, r.drawn, r.lost, r.points].forEach((v) => tr.appendChild(el("td", String(v))));
      const last = c.hasNrr
        ? (r.nrr === null ? "-" : (r.nrr > 0 ? "+" : "") + r.nrr.toFixed(3))
        : (r.diff > 0 ? "+" : "") + r.diff;
      tr.appendChild(el("td", last));
      t.appendChild(tr);
    });
    wrap.appendChild(t);
    return wrap;
  }

  // ---------- keyed update: touch only what changed ----------
  // Every element in the list has a KEY (which thing it is: "card:<match id>", "h:<heading>", ...) and a
  // SIGNATURE (what it shows; for a card HomeLogic.cardSignature). On each render:
  //   same key, same signature as last time -> the SAME element stays, untouched;
  //   same key, new signature               -> the same element gets the new content (in place); a card flashes;
  //   new key -> a new element;  a key not used any more -> its element is removed.
  // Keeping the elements keeps keyboard focus and a screen reader's place; rebuilding the list lost both.
  let shown = new Map();           // key -> { sig, node } of the last render
  let next = null;                 // the same, filled by the render in progress

  function keep(key, sig, build, flash) {
    while (next.has(key)) key += "+";              // the same key twice in one list: keep them apart
    const old = shown.get(key);
    let node;
    if (old && old.sig === sig) {
      node = old.node;
    } else if (old) {
      node = old.node;
      const fresh = build();
      node.className = fresh.className;            // also takes away an old "changed"
      if (fresh.hasAttribute("href")) node.setAttribute("href", fresh.getAttribute("href"));
      node.replaceChildren(...fresh.childNodes);
      if (flash) {
        void node.offsetWidth;                     // the browser must see the class gone, or the flash would not play again
        node.classList.add("changed");
        const done = () => node.classList.remove("changed");   // so moving the card later does not flash it again
        node.addEventListener("animationend", done, { once: true });
        node.addEventListener("animationcancel", done, { once: true });
      }
    } else {
      node = build();
    }
    next.set(key, { sig, node });
    return node;
  }

  // Put exactly `nodes` into `box`, in this order, moving as few elements as possible.
  function setChildren(box, nodes) {
    const wanted = new Set(nodes);
    for (const c of [...box.children]) if (!wanted.has(c)) c.remove();
    let at = box.firstElementChild;
    for (const n of nodes) {
      if (n === at) at = at.nextElementSibling;    // already in the right place: do not touch it
      else box.insertBefore(n, at);
    }
  }

  function render() {
    document.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === tab));
    next = new Map();
    const nodes = [];
    const message = (text) => nodes.push(keep("msg:" + text, text, () => el("p", text, "empty")));
    const heading = (text) => nodes.push(keep("h:" + text, text, () => el("h2", text, "day")));
    const matchCard = (m) => nodes.push(keep("card:" + m.id, HomeLogic.cardSignature(m), () => card(m), true));

    (function fill() {
      if (!loaded) {
        message(failed ? "Cannot load the scores. Trying again..." : "Loading...");
        return;
      }
      const list = visible();

      if (tab === "live") {
        const live = list.filter((m) => m.status === "live");
        if (live.length === 0) {
          message("No match is live right now.");
          const soon = list.filter((m) => m.status === "upcoming").slice(0, 5);
          if (soon.length) {
            heading("Coming up");
            soon.forEach(matchCard);
          }
        } else {
          live.forEach(matchCard);
        }
      } else if (tab === "schedule") {
        if (list.length === 0) message("No matches yet.");
        let lastDay = null;
        list.forEach((m) => {
          const day = fmtDay(m.startTime);
          if (day !== lastDay) { heading(day); lastDay = day; }
          matchCard(m);
        });
      } else if (tab === "results") {
        const done = list.filter((m) => m.status === "finished").reverse();
        if (done.length === 0) message("No results yet.");
        done.forEach(matchCard);
      } else {
        if (!standingsLoaded) {    // not arrived yet: say "loading", not "no matches" (that would be wrong)
          message(failed ? "Cannot load the points table. Trying again..." : "Loading the points table...");
          return;
        }
        const c = $("comp").value;
        const tables = standings.competitions.filter((x) => !c || x.name === c);
        if (tables.length === 0) message("No finished group-stage matches yet.");
        tables.forEach((x) => nodes.push(keep("table:" + x.name, JSON.stringify(x), () => renderTable(x, standings.points))));
        if (tables.length && standings.points) {
          const text = "Win " + standings.points.win + ", draw / tie / no result " + standings.points.draw +
            ", loss " + standings.points.loss + ". Only group-stage matches count. P played, W won, D drawn, L lost, " +
            "NRR net run rate, Diff score difference.";
          nodes.push(keep("points-note", text, () => el("p", text, "small")));
        }
      }
    })();

    setChildren($("list"), nodes);
    shown = next;
  }

  // Rebuild the sports dropdown only when the list of sports really changed. Rebuilding it every 10 s
  // can close or reset the dropdown on a phone while the student is choosing.
  let shownCompetitions = null;      // the list now in the dropdown, as text (to compare quickly)

  function fillCompetitions() {
    const key = JSON.stringify(home.competitions);
    if (key === shownCompetitions) return;   // same list as on screen: leave the dropdown alone
    shownCompetitions = key;
    const sel = $("comp");
    const keep = sel.value;
    sel.innerHTML = "";
    const all = document.createElement("option");
    all.value = "";
    all.textContent = "All sports";
    sel.appendChild(all);
    for (const name of home.competitions) {
      const o = document.createElement("option");
      o.value = name;
      o.textContent = name;
      sel.appendChild(o);
    }
    if (keep && home.competitions.includes(keep)) sel.value = keep;
  }

  // One request at a time. On a slow network a reply can take longer than 10 s; without this,
  // requests pile up and an OLD reply that arrives last would put old scores back on the screen.
  let busy = false;
  let failures = 0;                // errors in a row (0 = the last request worked)
  let timer = null;                // the next planned refresh

  // Plan the next refresh. The wait comes from HomeLogic.nextDelay (public/js/home-logic.js, tested in test.js):
  // 10 s while a match is live, 60 s when nothing is, 10-20-40-60 s after errors, each +-20 % random spread.
  // A hidden tab sends nothing but keeps planning (so polling never stops for good, even on a phone that
  // does not send "visibilitychange" after a pause); coming back to the tab refreshes at once (below).
  function schedule() {
    clearTimeout(timer);
    const anyLive = home.matches.some((m) => m.status === "live");
    const wait = HomeLogic.nextDelay(failures, anyLive, Math.random());
    timer = setTimeout(() => { if (document.visibilityState === "hidden") schedule(); else refresh(); }, wait);
  }

  async function refresh() {
    if (busy) return;              // a request is still running: it plans the next one when it ends
    busy = true;
    try {
      const r = await fetch("/api/home", { cache: "no-cache" });
      if (!r.ok) throw new Error("bad status " + r.status);
      home = await r.json();
      if (tab === "points") {
        const s = await fetch("/api/standings", { cache: "no-cache" });
        if (s.ok) { standings = await s.json(); standingsLoaded = true; }
      }
      loaded = true;
      failed = false;
      failures = 0;
      $("note").textContent = "";
    } catch (e) {
      failed = true;
      failures++;
      $("note").textContent = loaded ? "Connection problem. Showing the last scores." : "";
    } finally {
      busy = false;                // always, after success AND after an error, or the page would never ask again
    }
    fillCompetitions();
    render();
    schedule();
  }

  function setTab(t) {
    tab = t;
    render();
    if (t === "points") refresh();
  }

  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refresh(); });
  window.addEventListener("online", () => refresh());   // the phone's network is back: do not wait up to 60 s
  render();
  refresh();
</script>
</body>
</html>
