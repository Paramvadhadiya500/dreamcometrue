<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Match</title>
<!-- Same tab icon and browser-bar color as index.html (keep the two pages the same). -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f3a5f'/%3E%3Ccircle cx='15' cy='17' r='8' fill='none' stroke='%23fff' stroke-width='3'/%3E%3Ccircle cx='25' cy='7' r='4.5' fill='%23d22'/%3E%3C/svg%3E">
<meta name="theme-color" content="#1f3a5f" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#3a6fb3" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/match.css">
</head>
<body>
<div id="conn" role="status"></div>
<!-- Screen readers only: a short sentence when the score changes (at most one per 8 s). It must exist,
     empty, from the start: a live region added together with its text is often not read out. -->
<div id="announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
<div class="page">
<a class="back" href="/">&larr; All matches</a>

<h1 id="name">Loading...</h1>
<p id="meta" class="small"></p>

<section class="board" id="board" aria-label="Score" hidden>
  <p id="status" class="pill"></p>
  <!-- kabaddi: SUPER RAID / SUPER TACKLE / ALL OUT / TECHNICAL POINT, big for 6 seconds when it happens -->
  <p id="kbPop" class="kb-pop" hidden></p>
  <!-- kabaddi: RAID STARTED on the scorer's phone -> "CSE RAIDING NOW" until the raid is saved -->
  <div id="kbRaiding" class="kb-raiding" hidden>
    <p id="kbRaidingTitle" class="kb-raiding-title"></p>
    <p id="kbRaidingBadges" class="kb-badges"></p>
  </div>

  <!-- football: PENALTY on the scorer's phone -> "PENALTY TO CSE!" until it is taken (kbPop above is the pop-up for goals too) -->
  <div id="fbPenalty" class="kb-raiding" hidden>
    <p id="fbPenaltyTitle" class="kb-raiding-title"></p>
  </div>

  <!-- simple sport, table tennis, volleyball, basketball: names left and right, the big numbers in the middle -->
  <div class="duel" id="duel" hidden>
    <span class="team a" id="nameA"></span>
    <span class="big"><span id="sA">0</span><span class="sep" aria-hidden="true">:</span><span id="sB">0</span></span>
    <span class="team b" id="nameB"></span>
    <span class="unit" id="unit"></span>
  </div>

  <!-- table tennis / volleyball / basketball: the game, set or quarter being played now, then the finished ones -->
  <p class="current" id="current" hidden><span id="curLabel"></span>: <span class="nums"><span id="pA">0</span> - <span id="pB">0</span></span></p>
  <p class="small" id="history"></p>

  <!-- kabaddi: a break banner, the players on court of each team, the big moments (not every raid) -->
  <div id="kabaddi" hidden>
    <p id="kbBanner" class="kb-banner" hidden></p>
    <div class="kb-court">
      <span class="kb-side a"><span id="kbDotsA" class="kb-dots" aria-hidden="true"></span> <b id="kbCourtA"></b></span>
      <span class="kb-label">on court</span>
      <span class="kb-side b"><b id="kbCourtB"></b> <span id="kbDotsB" class="kb-dots" aria-hidden="true"></span></span>
    </div>
    <div id="kbDanger" class="kb-danger"></div>
    <table id="kbTable" class="kb-table" hidden>
      <caption>Points by type</caption>
      <thead><tr><th scope="col">Type</th><th scope="col" id="kbTableA"></th><th scope="col" id="kbTableB"></th></tr></thead>
      <tbody id="kbTableBody"></tbody>
    </table>
    <h2 id="kbMomentsTitle" class="kb-title" hidden>Big moments</h2>
    <ol id="kbMoments" class="kb-moments"></ol>
  </div>

  <!-- football: the half, a banner, the scorers under each team, the shootout, every goal / penalty / card -->
  <div id="football" hidden>
    <div class="fb-scorers">
      <ul id="fbGoalsA" class="fb-goals a" aria-label="Goals team A"></ul>
      <ul id="fbGoalsB" class="fb-goals b" aria-label="Goals team B"></ul>
    </div>
    <p id="fbPeriod" class="current"></p>
    <p id="fbBanner" class="kb-banner" hidden></p>
    <div id="fbShootout" class="fb-shootout" hidden>
      <h2 class="kb-title">Penalty shootout</h2>
      <p id="fbShootScore" class="fb-shoot-score"></p>
      <div id="fbShootRows"></div>
      <p id="fbShootNote" class="small"></p>
    </div>
    <h2 id="fbEventsTitle" class="kb-title" hidden>Match events</h2>
    <ol id="fbEvents" class="kb-moments"></ol>
  </div>

  <div id="cricket" hidden>
    <p id="crToss" class="small"></p>
    <p class="cr-big" id="crBig"></p>
    <p class="cr-overs" id="crOvers"></p>
    <p id="crChase"></p>
    <p id="crFirst" class="small"></p>
    <p id="crOver" class="over"></p>
    <p id="crFree" class="free" hidden>FREE HIT</p>
    <p id="crExtras" class="small"></p>
  </div>

  <p class="result" id="result" hidden></p>
</section>
</div>

<script src="/socket.io/socket.io.min.js"></script>
<script src="/js/match-logic.js"></script>
<!-- The page's code (no inline script: the Content-Security-Policy allows only script files from this site). -->
<script src="/js/match.js"></script>
</body>
</html>
