<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Match</title>
<!-- Same tab icon and browser-bar color as index.html (keep the two pages the same). -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f3a5f'/%3E%3Ccircle cx='15' cy='17' r='8' fill='none' stroke='%23fff' stroke-width='3'/%3E%3Ccircle cx='25' cy='7' r='4.5' fill='%23d22'/%3E%3C/svg%3E">
<meta name="theme-color" content="#1f3a5f" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#3a6fb3" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="/css/base.css">
<style>
  body { background: var(--bg); color: var(--text); }
  .page { max-width: 640px; margin: 0 auto; padding: 0 12px 24px; }
  #conn { display: none; background: var(--alert); color: var(--on-alert); padding: 10px; text-align: center; font-weight: bold; }
  a.back { display: inline-block; margin: 12px 0 4px; color: var(--link); text-decoration: none; font-size: 16px; }
  h1 { font-size: 22px; margin: 4px 0 2px; }
  #meta { margin: 0; }

  /* The scoreboard card: status pill, then the score, then details. Numbers use equal-width digits
     (tabular-nums), so "9" -> "10" does not make the row jump. */
  .board { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
           padding: 16px 12px; margin-top: 14px; text-align: center; }
  .pill { display: inline-block; margin: 0; padding: 2px 12px; border: 2px solid currentColor; border-radius: 999px;
          font-size: 13px; font-weight: bold; letter-spacing: 1px; }
  .pill.live { color: var(--live); }
  .pill.finished { color: var(--result); }

  /* names left and right, big numbers in the middle (simple sport, table tennis, volleyball) */
  .duel { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; column-gap: 10px; margin: 14px 0 0; }
  .team { font-weight: bold; font-size: 17px; overflow-wrap: anywhere; }
  .team.a { text-align: right; }
  .team.b { text-align: left; }
  .big { font-size: clamp(40px, 13vw, 64px); font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .sep { margin: 0 0.12em; }
  .unit { grid-column: 2; color: var(--text-muted); font-size: 14px; }
  .current { font-size: 18px; margin: 12px 0 0; }
  .current .nums { font-weight: bold; font-variant-numeric: tabular-nums; }
  #history { margin: 8px 0 0; }

  /* cricket */
  .cr-big { font-size: clamp(32px, 11vw, 52px); font-weight: 800; line-height: 1.15; margin: 12px 0 2px; font-variant-numeric: tabular-nums; }
  .cr-overs { font-size: 17px; font-weight: 600; margin: 0; font-variant-numeric: tabular-nums; }
  #crChase { font-weight: bold; margin: 10px 0 0; }
  #crFirst { margin: 6px 0 0; }
  .over { font-size: 22px; letter-spacing: 2px; word-spacing: 6px; margin: 10px 0 0; }
  .free { display: inline-block; background: var(--highlight); color: var(--on-highlight); padding: 4px 10px; font-weight: bold; border-radius: 4px; margin: 10px 0 0; }
  #crExtras { margin: 10px 0 0; }

  .result { font-size: 18px; font-weight: bold; color: var(--result); margin: 14px 0 0; }

  /* A number that just changed flashes once: pale background and a small grow, fading back in 1.5 s.
     Only background and transform are animated (cheap for the phone). "Reduce motion": base.css makes it instant. */
  #sA, #sB, #pA, #pB, #crBig { display: inline-block; border-radius: 6px; }
  #crBig { padding: 0 6px; }
  @keyframes bump { from { background-color: var(--flash); transform: scale(1.12); } }
  .bump { animation: bump 1.5s ease-out; }
</style>
</head>
<body>
<div id="conn">Reconnecting... the score below may be out of date</div>
<div class="page">
<a class="back" href="/">&larr; All matches</a>

<h1 id="name">Loading...</h1>
<p id="meta" class="small"></p>

<section class="board" id="board" aria-label="Score" hidden>
  <p id="status" class="pill"></p>

  <!-- simple sport, table tennis, volleyball: names left and right, the big numbers in the middle -->
  <div class="duel" id="duel" hidden>
    <span class="team a" id="nameA"></span>
    <span class="big"><span id="sA">0</span><span class="sep" aria-hidden="true">:</span><span id="sB">0</span></span>
    <span class="team b" id="nameB"></span>
    <span class="unit" id="unit"></span>
  </div>

  <!-- table tennis / volleyball: the game or set being played now, then the finished ones -->
  <p class="current" id="current" hidden><span id="curLabel"></span>: <span class="nums"><span id="pA">0</span> - <span id="pB">0</span></span></p>
  <p class="small" id="history"></p>

  <div id="cricket" hidden>
    <p class="cr-big" id="crBig"></p>
    <p class="cr-overs" id="crOvers"></p>
    <p id="crChase"></p>
    <p id="crFirst" class="small"></p>
    <p id="crOver" class="over"></p>
    <p id="crFree" class="free" hidden>FREE HIT</p>
    <p id="crExtras" class="small"></p>
  </div>

  <p class="result" id="result" hidden></p>
</section>
</div>

<script src="/socket.io/socket.io.min.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const matchId = new URLSearchParams(location.search).get("id");
  if (!matchId) location.replace("/");

  const socket = io();
  let latest = 0;                          // newest version seen for this match
  let gotScore = false;                    // has any score arrived since the page opened?

  const teamName = (s, t) => (t === "A" ? s.teamA : s.teamB) || "Team " + t;

  // the red bar at the top: empty text hides it
  function showConn(text) {
    $("conn").textContent = text;
    $("conn").style.display = text ? "block" : "none";
  }

  function join() { if (matchId) socket.emit("join-match", matchId); }
  socket.on("connect", () => { showConn(""); join(); });
  socket.on("disconnect", () => { showConn("Reconnecting... the score below may be out of date"); });
  // The server cannot be reached. This also happens when the page OPENS while the server is down:
  // without this the page said "Loading..." forever. Socket.IO keeps trying again by itself.
  socket.on("connect_error", () => {
    showConn(gotScore ? "Reconnecting... the score below may be out of date" : "Cannot reach the server. Trying again...");
  });

  // Put a score number on the page. If it really changed (and it is not the first score after opening),
  // it flashes once. Same number again (a repeated or newer update with the same score): nothing happens.
  let firstScore = true;
  function setNum(id, value) {
    const e = $(id);
    const text = String(value);
    if (e.textContent === text) return;
    e.textContent = text;
    if (firstScore) return;
    e.classList.remove("bump");
    void e.offsetWidth;                    // the browser must see the class gone, or the animation would not play again
    e.classList.add("bump");
  }
  // When the flash ends (or is stopped), take the class away again. But the "stopped" event of an OLD flash
  // arrives a moment AFTER a new flash has started (a number that changed twice quickly): so only remove the
  // class when no animation is running on the element any more.
  function endFlash(x) {
    if (x.target.getAnimations().length === 0) x.target.classList.remove("bump");
  }
  for (const id of ["sA", "sB", "pA", "pB", "crBig"]) {
    $(id).addEventListener("animationend", endFlash);
    $(id).addEventListener("animationcancel", endFlash);
  }

  // "CSE won", "Draw", or the engine's own text (cricket: "CSE won by 5 runs")
  function resultText(s) {
    if (s.resultText) return s.resultText;
    if (s.winner === "draw") return "Draw";
    return teamName(s, s.winner) + " won";
  }

  function showCricket(s) {
    const ci = s.innings[s.inning - 1];
    const first = s.innings[0];
    setNum("crBig", teamName(s, ci.battingTeam) + " " + ci.runs + "/" + ci.wickets);
    $("crOvers").textContent = ci.overs + " / " + s.maxOvers + " overs · Run rate " + ci.runRate.toFixed(2);

    let chase = "";
    if (s.inning === 2 && s.status !== "finished") {
      chase = "Target " + s.target + ". Need " + s.need + " from " + s.ballsLeft + " balls";
      if (s.requiredRate !== null) chase += " (required rate " + s.requiredRate.toFixed(2) + ")";
    }
    $("crChase").textContent = chase;

    $("crFirst").textContent = s.inning === 2
      ? teamName(s, first.battingTeam) + " batted: " + first.runs + "/" + first.wickets + " (" + first.overs + " overs)"
      : "";

    $("crOver").textContent = ci.recent.join("  ");
    $("crFree").hidden = !s.freeHit;
    $("crExtras").textContent = "Extras: " + ci.extras.total +
      " (wides " + ci.extras.wides + ", no balls " + ci.extras.noBalls +
      ", byes " + ci.extras.byes + ", leg byes " + ci.extras.legByes + ")";
  }

  socket.on("score:update", (s) => {
    if (s.matchId !== matchId) return;
    if (s.version < latest) return;        // old news, ignore
    latest = s.version;
    gotScore = true;

    $("name").textContent = s.name;
    document.title = s.name;
    $("board").hidden = false;
    const finished = s.status === "finished";
    $("status").textContent = finished ? "FINISHED" : "LIVE";
    $("status").className = "pill " + (finished ? "finished" : "live");
    $("result").textContent = finished ? resultText(s) : "";
    $("result").hidden = !finished;

    const isTT = s.sport === "table_tennis";
    const isVB = s.sport === "volleyball";
    const isCR = s.sport === "cricket";
    $("duel").hidden = isCR;
    $("current").hidden = !(isTT || isVB);
    $("history").hidden = !(isTT || isVB);
    $("cricket").hidden = !isCR;

    if (isCR) {
      showCricket(s);
    } else {
      showDuel(s, isTT, isVB);
    }
    firstScore = false;
  });

  function showDuel(s, isTT, isVB) {
    $("nameA").textContent = teamName(s, "A");
    $("nameB").textContent = teamName(s, "B");
    if (isTT || isVB) {
      setNum("sA", isVB ? s.setsA : s.gamesA);
      setNum("sB", isVB ? s.setsB : s.gamesB);
      $("unit").textContent = isVB ? "sets" : "games";
      $("curLabel").textContent = isVB
        ? (s.isDeciding ? "Deciding set, to " + s.target : "Set " + s.currentSet + ", to " + s.target)
        : "Current game";
      setNum("pA", s.pointsA);
      setNum("pB", s.pointsB);
      const done = isVB ? s.finishedSets : s.finishedGames;
      $("history").textContent = done.length ? (isVB ? "Sets: " : "Games: ") + done.map((g) => g.join("-")).join(", ") : "";
    } else {
      setNum("sA", s.scoreA);
      setNum("sB", s.scoreB);
      $("unit").textContent = "";
    }
  }

  // place, time and competition
  async function loadMeta() {
    if (!matchId) return;
    try {
      const r = await fetch("/api/match/" + encodeURIComponent(matchId));
      if (r.status === 404) { $("name").textContent = "Match not found"; return; }
      const m = await r.json();
      const parts = [m.competition];
      if (m.stage === "knockout") parts.push("Knockout");
      if (m.venue) parts.push(m.venue);
      if (m.startTime) parts.push(new Date(m.startTime).toLocaleString([], { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }));
      $("meta").textContent = parts.join(" · ");
    } catch (e) { /* the score still works without this line */ }
  }
  loadMeta();
</script>
</body>
</html>
